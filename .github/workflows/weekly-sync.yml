name: Haftalik Avtomatik Obyektlar Yangilanishi (Weekly Construction Sync)

on:
  schedule:
    # Har dushanba kuni Toshkent vaqti bilan 08:00 da (UTC 03:00)
    - cron: '0 3 * * 1'
  workflow_dispatch: # Qo'lda GitHub orqali istalgan vaqtda ishga tushirish imkoniyati

jobs:
  weekly-sync:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Kodni yuklab olish (Checkout)
        uses: actions/checkout@v4

      - name: Node o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bog'liqliklarni o'rnatish
        working-directory: web
        run: npm ci

      - name: DSHK obyektlarini Neon bazasiga yozish
        working-directory: web
        run: node scripts/sync-dshk-to-neon.mjs

      - name: Domtut (UYSOT) obyektlarini Neon bazasiga yozish
        working-directory: web
        run: node scripts/run-domtut-sync.mjs
