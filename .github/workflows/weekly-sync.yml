name: Haftalik Avtomatik Obyektlar Yangilanishi (Weekly Construction Sync)

on:
  schedule:
    # Har dushanba kuni Toshkent vaqti bilan 08:00 da (UTC 03:00)
    - cron: '0 3 * * 1'
  workflow_dispatch: # Qo'lda GitHub orqali istalgan vaqtda ishga tushirish imkoniyati

jobs:
  weekly-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklab olish (Checkout)
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bog'liqliklarni o'rnatish (Dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: O'zbekiston bo'ylab yangi obyektlarni tekshirish va yozish
        env:
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID || '1ZmPUfae89OAiK4kJykrL4O3XaSrYUK8KoJlmCjYhzKA' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python scraper/weekly_sync.py

      - name: Veb-ilova keshini yangilash (Webhook)
        run: |
          curl -X POST https://b2b-roadmap.onrender.com/api/objects/sync || echo "Render sync pinged"
