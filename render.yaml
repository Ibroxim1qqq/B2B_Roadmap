services:
  - type: web
    name: b2b-samarqand-map
    env: node
    plan: free
    region: oregon
    rootDir: web
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      # Secrets are set in the Render dashboard, never in this file. sync: false keeps existing values.
      - key: DATABASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_NAME
        value: UYSOT B2B
      - key: NODE_VERSION
        value: 20.18.0
